org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App version for local builds; CI release builds override both from the tag (vX.Y.Z).
rawboy.versionName=0.1.0
rawboy.versionCode=1
# Native ABIs (engine and all apps); CI release builds pass -Prawboy.abis=arm64-v8a.
rawboy.abis=arm64-v8a,x86_64
